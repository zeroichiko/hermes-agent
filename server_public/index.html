<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT-CDP Bridge</title>
    <link rel="stylesheet" href="/style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New chat
                </button>
            </div>
            <div class="chat-list" id="chatList"></div>
            <div class="sidebar-footer">
                <button class="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div class="chat-header">
                <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
                <h1>ChatGPT-CDP Bridge</h1>
                <div class="status-indicator" id="statusIndicator">●</div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <h2>Welcome to ChatGPT-CDP Bridge</h2>
                    <p>Start a conversation by typing a message below.</p>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="userInput" placeholder="Type a message..." rows="3" onkeydown="handleInputKeydown(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="toggleSettings()">✕</button>
            </div>
            <div class="settings-body">
                <div class="setting-group">
                    <label for="apiUrl">API URL</label>
                    <input type="text" id="apiUrl" value="http://localhost:8080">
                </div>
                <div class="setting-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" value="chatgpt-cdp">
                </div>
                <div class="setting-group">
                    <label for="temperature">Temperature</label>
                    <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1">
                </div>
                <div class="setting-group">
                    <label for="maxTokens">Max Tokens</label>
                    <input type="number" id="maxTokens" value="2048" min="1" max="8192">
                </div>
                <button class="save-settings-btn" onclick="saveSettings()">Save Settings</button>
            </div>
        </div>
    </div>
</body>
</html>
